name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL eagerly via env(), even for
      # `prisma generate`, which never connects. Unit tests mock PrismaService,
      # so a placeholder is enough here; the real URL belongs to the e2e job.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm/action-setup v4.1.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.26.1
          run_install: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run workflow:validate
      - run: pnpm run prisma:generate
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:e2e
      - run: pnpm run security:audit
